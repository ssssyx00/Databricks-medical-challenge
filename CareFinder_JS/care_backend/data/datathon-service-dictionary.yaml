    locator: Bronchoscopy suite and personnel recommendations
evaluation:
  essential: All slots require positive, branch-attributed evidence. Use its exact
    excerpt and provenance.
  alternatives: A|B is one slot. One qualifying resource is sufficient.
  supporting: Gather context and corroboration after establishing the service claim.
    Search cues alone carry no evidence weight.
  authority_readiness: Assess independently, only for the jurisdiction, facility type,
    programme and modality covered by the source. These are selected checks, not an
    exhaustive legal audit.
  authorization_checks: Confirm using the relevant regulator or registry for this
    branch and activity.
  uncertainty: Record confirmed, contradicted, conflicting or unknown. Missing evidence
    remains unknown.
  web_query: '"{facility_name}" "{branch_or_city}" "{search_term}"'
  research_leads: Potential source results from the per-service authority search.
    Do not treat a lead as a verified requirement.
